<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SentinelAI | Connecting</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #080d18;
      color: #e5edf9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(90%, 460px);
      padding: 36px;
      text-align: center;
      border: 1px solid #25334a;
      border-radius: 18px;
      background: #101827;
    }
    .logo { font-size: 38px; margin-bottom: 12px; }
    h1 { margin: 0 0 12px; font-size: 26px; }
    p { color: #9eafc7; line-height: 1.6; }
    .status { margin: 24px 0; color: #67e8a5; }
    button, a {
      display: inline-block;
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 14px;
      text-decoration: none;
      cursor: pointer;
    }
    .secondary { background: transparent; color: #9eafc7; }
    #actions { display: none; }
  </style>
</head>
<body>
  <main>
    <div class="logo">◈</div>
    <h1>SentinelAI</h1>
    <p>Machine-learning-powered network intrusion detection.</p>
    <div class="status" id="status">Connecting to detection service…</div>
    <p id="detail">The backend may take a little longer to start after inactivity.</p>
    <div id="actions">
      <button onclick="startCheck()">Retry connection</button>
      <p><a class="secondary" href="https://sentinel-ai-silk-seven.vercel.app/">Open dashboard anyway</a></p>
    </div>
  </main>

  <script>
    const API = "https://sentinelai-api-dbuv.onrender.com";
    const DASHBOARD = "https://sentinel-ai-silk-seven.vercel.app/";
    let attempts = 0;
    let cancelled = false;

    async function startCheck() {
      cancelled = false;
      attempts = 0;
      document.getElementById("actions").style.display = "none";
      checkBackend();
    }

    async function checkBackend() {
      if (cancelled) return;
      attempts++;

      document.getElementById("status").textContent =
        `Waking up backend… (attempt ${attempts})`;

      try {
        const response = await fetch(API + "/health", {
          cache: "no-store",
          signal: AbortSignal.timeout(15000)
        });

        if (response.ok) {
          document.getElementById("status").textContent =
            "Backend is responding. Opening dashboard…";
          document.getElementById("detail").textContent =
            "Redirecting you to SentinelAI.";
          setTimeout(() => {
            window.location.href = DASHBOARD;
          }, 800);
          return;
        }
      } catch (error) {
        // The backend may still be waking up.
      }

      if (attempts < 12 && !cancelled) {
        document.getElementById("detail").textContent =
          "Please wait while the service starts. This can take a minute or more.";
        setTimeout(checkBackend, 5000);
      } else {
        document.getElementById("status").textContent =
          "The service hasn't responded yet.";
        document.getElementById("detail").textContent =
          "You can retry or open the dashboard directly.";
        document.getElementById("actions").style.display = "block";
      }
    }

    startCheck();
  </script>
</body>
</html>
